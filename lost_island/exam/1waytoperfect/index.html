<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Dubrovіn AR — Візуалізація алгоритмів</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <!-- Бібліотеки через CDN -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Dubrovіn AR — Візуалізація алгоритмів</h1>
    <div id="ar-container">
        <div id="start-msg">
            <b>Наведіть камеру на маркер-алгоритм</b><br>
            <small>Кожне сканування генерує нові випадкові дані!</small>
        </div>
        <div id="stepper"></div>
        <div id="ml-result"></div>
        
        <!-- Нова секція для 3D-візуалізації сортування -->
        <div id="sorting-visualization" style="display: none;">
            <h3 id="viz-title">🎮 Інтерактивна 3D-візуалізація</h3>
            <div id="controls">
                <button id="startSortBtn" class="sort-btn">▶ Запустити анімацію</button>
                <button id="resetBtn" class="sort-btn">🔄 Нові дані</button>
                <div class="speed-control">
                    <label>Швидкість:</label>
                    <input type="range" id="speedSlider" min="100" max="2000" value="600">
                    <span id="speedValue">600 мс</span>
                </div>
            </div>
            <div id="timer">Готово до анімації</div>
            <div id="viz-description"></div>
            
            <!-- Графік порівняння -->
            <div class="chart-container">
                <canvas id="chart" width="400" height="200"></canvas>
            </div>
            
            <!-- 3D сцена для візуалізації -->
            <a-scene embedded id="sorting-scene" style="width: 100%; height: 300px;">
                <a-entity id="balls"></a-entity>
                <a-camera position="0 0 5"></a-camera>
                <a-light type="ambient" color="#445"></a-light>
                <a-light type="directional" color="#fff" position="2 5 3" intensity="0.8"></a-light>
            </a-scene>
        </div>
    </div>

    <!-- MindAR сцена -->
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true;"
      color-space="sRGB"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      id="mindar-scene"
      style="width: 100vw; height: 70vh; min-height: 350px"
    >
      <a-entity mindar-image-target="targetIndex: 0">
        <a-box color="#EF2D5E" depth="0.1" height="0.5" width="0.5" position="0 0.3 0"></a-box>
        <a-entity id="algo-content-0" position="0 0 0"></a-entity>
        <a-entity id="algo-result-0" position="0 0.65 0"></a-entity>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-box color="#4CC3D9" depth="0.1" height="0.5" width="0.5" position="0 0.3 0"></a-box>
        <a-entity id="algo-content-1" position="0 0 0"></a-entity>
        <a-entity id="algo-result-1" position="0 0.65 0"></a-entity>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-box color="#FFC65D" depth="0.1" height="0.5" width="0.5" position="0 0.3 0"></a-box>
        <a-entity id="algo-content-2" position="0 0 0"></a-entity>
        <a-entity id="algo-result-2" position="0 0.65 0"></a-entity>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-box color="#7BC8A4" depth="0.1" height="0.5" width="0.5" position="0 0.3 0"></a-box>
        <a-entity id="algo-content-3" position="0 0 0"></a-entity>
        <a-entity id="algo-result-3" position="0 0.65 0"></a-entity>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 4">
        <a-box color="#A9A9F5" depth="0.1" height="0.5" width="0.5" position="0 0.3 0"></a-box>
        <a-entity id="algo-content-4" position="0 0 0"></a-entity>
        <a-entity id="algo-result-4" position="0 0.65 0"></a-entity>
      </a-entity>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script src="app.js"></script>
    <script src="ml_optimizer.js"></script>
    <script src="sorting_visualization.js"></script>
</body>
</html>
